<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kopfschmerz Tracker</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Arial; padding: 15px; }
input { width: 100%; margin: 5px 0; padding: 8px; }
button { padding: 10px; width: 100%; }
.good { background:#c6efce }
.medium { background:#ffeb9c }
.bad { background:#ffc7ce }
</style>
</head>

<body>

<h2>Kopfschmerz Tracker</h2>

<input type="date" id="datum">
<input type="number" id="schmerz" placeholder="Schmerz (1-10)">
<input type="text" id="art" placeholder="Art der Schmerzen">
<input type="text" id="zeit" placeholder="Zeitpunkt/Dauer">
<input type="number" id="trinken" placeholder="Liter getrunken">
<input type="number" id="schlaf" placeholder="Schlaf (h)">
<input type="number" id="stress" placeholder="Stress (1-10)">
<input type="text" id="sport" placeholder="Sport">

<button onclick="save()">Speichern</button>

<canvas id="chart"></canvas>

<script>
let data = JSON.parse(localStorage.getItem("data")) || [];

function save(){
let entry = {
date: datum.value,
pain: +schmerz.value,
drink: +trinken.value,
sleep: +schlaf.value,
stress: +stress.value
};
data.push(entry);
localStorage.setItem("data", JSON.stringify(data));
draw();
}

function draw(){
let labels = data.map(e=>e.date);
let values = data.map(e=>e.pain);

new Chart(document.getElementById("chart"), {
type:"line",
data:{labels:labels,datasets:[{label:"Schmerz",data:values}]}
});
}

draw();
</script>

</body>
</html>
